name: Compilar APK

on:
  push:
    # Los cambios solo de documentación no crean una versión nueva de la app.
    paths-ignore:
      - "README.md"
      - "LICENSE"
      - "docs/**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Compilar
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk EspacioLibre.apk

      - uses: actions/upload-artifact@v4
        with:
          name: EspacioLibre-apk
          path: EspacioLibre.apk

      # Cada compilación crea su propia versión en GitHub (v1.0.N), marcada como la última.
      # La app consulta /releases/latest, así que siempre encuentra la más nueva.
      # Despeja.apk es una copia para las instalaciones antiguas, que buscan ese nombre.
      - name: Publicar versión
        if: github.ref == 'refs/heads/main'
        run: cp EspacioLibre.apk Despeja.apk

      - name: Crear versión en GitHub
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          name: Espacio Libre 1.0.${{ github.run_number }}
          body: |
            Espacio Libre 1.0.${{ github.run_number }}.
            Descarga `EspacioLibre.apk` en tu Android y ábrelo para instalar. Si ya tienes la app, se actualiza desde dentro.

            Novedades:
            ${{ github.event.head_commit.message }}

            build: ${{ github.run_number }}
          prerelease: false
          make_latest: true
          files: |
            EspacioLibre.apk
            Despeja.apk
